{% extends "dashboard/base_dashboard.html" %}

{% block dashboard_content %}
<h1 class="text-danger">Delete User</h1>
<div class="card border-danger shadow-sm">
  <div class="card-body">
    <p>
      Permanently delete <strong>{{ target_user.username }}</strong>
      ({{ target_user.get_full_name|default:"no name" }})?
    </p>
    <p class="small text-muted">All of their appointments will also be deleted.</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Yes, Delete</button>
      <a class="btn btn-secondary" href="{% url 'dashboard:users_list' %}">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
